paths:
  /api/v1/rider/auth/register:
    post:
      tags:
        - Rider
      summary: Register as a rider
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                password:
                  type: string
                phone:
                  type: string
                vehicleType:
                  type: string
                vehicleNumber:
                  type: string
      responses:
        201:
          description: Created

  /api/v1/rider/profile:
    get:
      tags:
        - Rider
      summary: Get rider profile
      security:
        - BearerAuth: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryRider'
    put:
      tags:
        - Rider
      summary: Update rider profile
      security:
        - BearerAuth: []
      responses:
        200:
          description: OK

  /api/v1/rider/deliveries/available:
    get:
      tags:
        - Delivery
      summary: Get available deliveries
      security:
        - BearerAuth: []
      responses:
        200:
          description: OK

  /api/v1/rider/deliveries/{id}/accept:
    post:
      tags:
        - Delivery
      summary: Accept delivery
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: OK

  /api/v1/rider/location/update:
    post:
      tags:
        - Delivery
      summary: Update rider location
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                latitude:
                  type: number
                longitude:
                  type: number
      responses:
        200:
          description: OK
