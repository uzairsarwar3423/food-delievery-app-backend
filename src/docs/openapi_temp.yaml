                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      isFavorite:
                        type: boolean

components:
  schemas:
    UpdateProfileRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string

    AddAddressRequest:
      type: object
      required:
        - label
        - fullAddress
        - city
        - state
        - postalCode
      properties:
        label:
          type: string
        fullAddress:
          type: string
        addressLine2:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        isDefault:
          type: boolean
        deliveryInstructions:
          type: string

    UpdateAddressRequest:
      type: object
      properties:
        label:
          type: string
        fullAddress:
          type: string
        addressLine2:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        isDefault:
          type: boolean
        deliveryInstructions:
          type: string
