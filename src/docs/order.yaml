paths:
  /api/v1/orders:
    get:
      tags:
        - Orders
      summary: List order history
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      tags:
        - Orders
      summary: Place a new order
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                restaurantId:
                  type: string
                  format: uuid
                deliveryAddressId:
                  type: string
                  format: uuid
                paymentMethod:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      menuItemId:
                        type: string
                        format: uuid
                      quantity:
                        type: integer
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /api/v1/orders/active:
    get:
      tags:
        - Orders
      summary: Get active orders
      security:
        - BearerAuth: []
      responses:
        200:
          description: OK

  /api/v1/orders/stats:
    get:
      tags:
        - Orders
      summary: Get order stats
      security:
        - BearerAuth: []
      responses:
        200:
          description: OK

  /api/v1/orders/{id}:
    get:
      tags:
        - Orders
      summary: Get order details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /api/v1/orders/{id}/cancel:
    put:
      tags:
        - Orders
      summary: Cancel order
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: OK

  /api/v1/orders/{id}/status:
    put:
      tags:
        - Orders
      summary: Update order status
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [CONFIRMED, PREPARING, READY_FOR_PICKUP, OUT_FOR_DELIVERY, DELIVERED, CANCELLED]
      responses:
        200:
          description: OK
