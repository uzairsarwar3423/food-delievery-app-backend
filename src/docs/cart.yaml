paths:
  /api/v1/cart:
    get:
      tags:
        - Cart
      summary: Fetch cart
      security:
        - BearerAuth: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CartItem'

  /api/v1/cart/items:
    post:
      tags:
        - Cart
      summary: Add item to cart
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                menuItemId:
                  type: string
                  format: uuid
                quantity:
                  type: integer
      responses:
        200:
          description: OK

  /api/v1/cart/items/{itemId}:
    put:
      tags:
        - Cart
      summary: Update cart item
      security:
        - BearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
      responses:
        200:
          description: OK
    delete:
      tags:
        - Cart
      summary: Remove item from cart
      security:
        - BearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: OK

  /api/v1/cart/clear:
    delete:
      tags:
        - Cart
      summary: Clear cart
      security:
        - BearerAuth: []
      responses:
        200:
          description: OK
