paths:
  /health:
    get:
      summary: API Health Check
      description: Returns the health status, uptime, and versions of the API
      tags: [System]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  app:
                    type: string
                  version:
                    type: string
                  environment:
                    type: string
                  timestamp:
                    type: string
                  uptime:
                    type: string
