paths:
  /api/v1/admin/dashboard:
    get:
      summary: Get admin dashboard statistics
      tags: [Admin]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object

  /api/v1/admin/users:
    get:
      summary: Get all users with filters
      tags: [Admin - Users]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: role
          schema:
            type: string
            enum: [CUSTOMER, RESTAURANT_OWNER, DELIVERY_PERSON, ADMIN]
        - in: query
          name: isActive
          schema:
            type: boolean
      responses:
        '200':
          description: List of users

  /api/v1/admin/users/{id}/status:
    put:
      summary: Update user active status
      tags: [Admin - Users]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - isActive
              properties:
                isActive:
                  type: boolean
      responses:
        '200':
          description: Status updated

  /api/v1/admin/restaurants/pending:
    get:
      summary: Get restaurants pending approval
      tags: [Admin - Restaurants]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of pending restaurants

  /api/v1/admin/restaurants/{id}/approve:
    put:
      summary: Approve restaurant registration
      tags: [Admin - Restaurants]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Restaurant approved

  /api/v1/admin/riders/pending:
    get:
      summary: Get riders with pending document verification
      tags: [Admin - Riders]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of pending riders

  /api/v1/admin/riders/documents/{id}/verify:
    put:
      summary: Verify/Reject rider document
      tags: [Admin - Riders]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [APPROVED, REJECTED]
                reviewNote:
                  type: string
      responses:
        '200':
          description: Document verified

  /api/v1/admin/analytics/revenue:
    get:
      summary: Get revenue analytics
      tags: [Admin - Analytics]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Revenue analytics data

  /api/v1/admin/coupons:
    post:
      summary: Create a new coupon
      tags: [Admin - Coupons]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Coupon'
      responses:
        '201':
          description: Coupon created

  /api/v1/admin/payouts/{id}/process:
    put:
      summary: Process a rider payout request
      tags: [Admin - Payments]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [COMPLETED, REJECTED]
                transactionId:
                  type: string
                adminNotes:
                  type: string
      responses:
        '200':
          description: Payout processed
