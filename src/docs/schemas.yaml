components:
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          example: Success
        data:
          type: object

    ApiError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        statusCode:
          type: integer
          example: 400
        message:
          type: string
          example: Bad Request
        errors:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
              field:
                type: string

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [CUSTOMER, RESTAURANT_OWNER, DELIVERY_PERSON, ADMIN]
        avatarUrl:
          type: string
        isEmailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
    
    UserAddress:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        addressLine1:
          type: string
        addressLine2:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        isDefault:
          type: boolean
        deliveryInstructions:
          type: string

    UserProfileResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/User'

    AddressListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/UserAddress'

    AddressResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UserAddress'

    Restaurant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        logoUrl:
          type: string
        coverImageUrl:
          type: string
        coverImages:
          type: array
          items:
            type: string
        phone:
          type: string
        email:
          type: string
        addressLine1:
          type: string
        city:
          type: string
        state:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        status:
          type: string
        averageRating:
          type: number
        estimatedDeliveryMin:
          type: integer
        estimatedDeliveryMax:
          type: integer
        cuisineTypes:
          type: array
          items:
            type: string
        isOpen:
          type: boolean
        isFeatured:
          type: boolean

    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        displayOrder:
          type: integer
        isActive:
          type: boolean

