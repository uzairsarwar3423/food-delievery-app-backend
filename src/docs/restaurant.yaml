paths:
  /api/v1/restaurants:
    get:
      tags:
        - Restaurants
      summary: Get all restaurants
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Restaurant'
    post:
      tags:
        - Restaurants
      summary: Create a new restaurant
      security:
        - BearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                addressLine1:
                  type: string
                city:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                logo:
                  type: string
                  format: binary
                banner:
                  type: string
                  format: binary
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'

  /api/v1/restaurants/nearby:
    get:
      tags:
        - Restaurants
      summary: Get nearby restaurants
      parameters:
        - name: latitude
          in: query
          required: true
          schema:
            type: number
        - name: longitude
          in: query
          required: true
          schema:
            type: number
      responses:
        200:
          description: OK

  /api/v1/restaurants/{id}:
    get:
      tags:
        - Restaurants
      summary: Get restaurant by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
    put:
      tags:
        - Restaurants
      summary: Update restaurant
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: OK
    delete:
      tags:
        - Restaurants
      summary: Delete restaurant
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        204:
          description: No Content
