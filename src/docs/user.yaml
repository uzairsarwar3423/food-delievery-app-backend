paths:
  /api/v1/users/profile:
    get:
      summary: Get current user profile
      tags: [Users]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Unauthorized
    put:
      summary: Update user profile
      tags: [Users]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          description: Validation error
        '401':
          description: Unauthorized

  /api/v1/users/avatar:
    post:
      summary: Upload user avatar
      tags: [Users]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Avatar uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  statusCode:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      avatarUrl:
                        type: string
        '400':
          description: Invalid file or no file uploaded
        '401':
          description: Unauthorized
    delete:
      summary: Delete user avatar
      tags: [Users]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Avatar deleted successfully
        '401':
          description: Unauthorized

  /api/v1/users/addresses:
    get:
      summary: Get all user addresses
      tags: [Users]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Addresses retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressListResponse'
        '401':
          description: Unauthorized
    post:
      summary: Add a new address
      tags: [Users]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAddressRequest'
      responses:
        '201':
          description: Address created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
        '400':
          description: Validation error
        '401':
          description: Unauthorized

  /api/v1/users/addresses/{id}:
    get:
      summary: Get address by ID
      tags: [Users]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Address retrieved successfully
        '404':
          description: Address not found
    put:
      summary: Update an address
      tags: [Users]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAddressRequest'
      responses:
        '200':
          description: Address updated successfully
        '404':
          description: Address not found
    delete:
      summary: Delete an address
      tags: [Users]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Address deleted successfully
        '400':
          description: Cannot delete address with active orders
        '404':
          description: Address not found

  /api/v1/users/addresses/{id}/default:
    put:
      summary: Set address as default
      tags: [Users]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Default address updated successfully
        '404':
          description: Address not found

  /api/v1/users/favorites:
    get:
      summary: Get favorite restaurants
      tags: [Users]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Favorites retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  statusCode:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        userId:
                          type: string
                        restaurantId:
                          type: string
                        restaurant:
                          type: object

  /api/v1/users/favorites/{restaurantId}:
    post:
      summary: Toggle restaurant as favorite
      tags: [Users]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: restaurantId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Favorite toggled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      isFavorite:
                        type: boolean

components:
  schemas:
    UpdateProfileRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string

    AddAddressRequest:
      type: object
      required:
        - label
        - fullAddress
        - city
        - state
        - postalCode
      properties:
        label:
          type: string
        fullAddress:
          type: string
        addressLine2:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        isDefault:
          type: boolean
        deliveryInstructions:
          type: string

    UpdateAddressRequest:
      type: object
      properties:
        label:
          type: string
        fullAddress:
          type: string
        addressLine2:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        isDefault:
          type: boolean
        deliveryInstructions:
          type: string
